<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:500px;height:500px;overflow:hidden;font-family:"Noto Sans CJK KR",sans-serif}
.w{position:relative;width:500px;height:500px;overflow:hidden;background:
 radial-gradient(260px 200px at 50% 58%,rgba(124,58,237,.45),transparent 70%),
 radial-gradient(300px 220px at 15% 10%,rgba(59,130,246,.35),transparent 70%),
 radial-gradient(260px 200px at 90% 20%,rgba(236,72,153,.22),transparent 70%),
 linear-gradient(#070a1c,#0b0820 55%,#05040d)}
.floor{position:absolute;left:-50%;right:-50%;bottom:-40px;height:220px;transform:perspective(260px) rotateX(62deg);transform-origin:bottom;
 background-image:linear-gradient(rgba(129,140,248,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.35) 1px,transparent 1px);background-size:34px 34px;
 -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:#c7d2fe;box-shadow:0 0 6px #a5b4fc}
.title{position:absolute;top:26px;left:0;right:0;text-align:center}
.title h1{margin:0;font-size:78px;line-height:1;font-weight:900;letter-spacing:-3px;
 background:linear-gradient(180deg,#ffffff 0%,#dbe4ff 45%,#a5b4fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 #3b2a8f) drop-shadow(0 0 18px rgba(139,92,246,.75))}
.title h1 em{font-style:normal;background:linear-gradient(180deg,#a5f3fc,#60a5fa 55%,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .en{margin:6px 0 0;font:700 13px "Noto Sans CJK KR";letter-spacing:9px;color:#c7d2fe;padding-left:9px}
.brand{position:absolute;top:140px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:7px}
.brand img{height:19px}.brand b{font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px}
.core{position:absolute;left:50%;top:96px;width:600px;transform:translateX(-50%)}
.core img{width:100%;display:block}
.lab{position:absolute;width:62px;display:grid;justify-items:center;gap:4px}
.lab .c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--k) 55%,#1a1f3a),#0a0d1c 75%);
 box-shadow:0 0 0 2px var(--k),0 0 18px var(--k),inset 0 -6px 12px rgba(0,0,0,.5)}
.lab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lab svg circle.f{fill:#fff;stroke:none}
.lab span{font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000;white-space:nowrap}
.tag{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);white-space:nowrap;padding:8px 18px;border-radius:99px;
 background:linear-gradient(90deg,#3b82f6,#7c3aed);color:#fff;font-size:15px;font-weight:800;letter-spacing:-.3px;box-shadow:0 6px 20px rgba(124,58,237,.55),inset 0 1px 0 rgba(255,255,255,.35)}
</style></head><body><div class="w">
<div class="floor"></div>
<div class="dust" id="dust"></div>
<div class="core"><img src="core.png"></div>
<div class="title"><h1>AI <em>랩시티</em></h1><p class="en">AI LABCITY</p></div>
<div class="brand"><img src="logo.png"><b>EDUINO AI</b></div>
<div id="labs"></div>
<div class="tag">시뮬레이션으로 배우는 인공지능</div>
</div>
<script>
const G={vision:'<path d="M -9 0 Q 0 -8 9 0 Q 0 8 -9 0 Z"/><circle cx="0" cy="0" r="2.8"/>',
language:'<path d="M -8 -6 H 8 V 4 H -1 L -5 8 V 4 H -8 Z"/><path d="M -5 -2 H 5 M -5 1 H 2"/>',
voice:'<path d="M -8 0 V 0 M -5 -4 V 4 M -2 -7 V 7 M 1 -3 V 3 M 4 -6 V 6 M 7 -2 V 2"/>',
data:'<path d="M -8 6 L -3 1 L 1 4 L 8 -5"/><path d="M 5 -5 H 8 V -2"/>',
physical:'<path d="M -7 7 L -2 -1 L 6 -4"/><circle cx="-2" cy="-1" r="2"/><path d="M 6 -4 L 8 -7 M 6 -4 L 9 -2"/>',
generative:'<path d="M 0 -9 Q 1 -1 9 0 Q 1 1 0 9 Q -1 1 -9 0 Q -1 -1 0 -9 Z"/>'};
const L=[['vision','영상처리','#14b8a6',18,206],['data','데이터 예측','#3b82f6',10,292],['voice','음성 AI','#f59e0b',30,378],
['language','언어 모델','#8b5cf6',420,206],['generative','생성형 AI','#ec4899',428,292],['physical','피지컬 AI','#84cc16',408,378]];
document.getElementById('labs').innerHTML=L.map(([g,n,c,x,y])=>`<div class="lab" style="left:${x}px;top:${y}px;--k:${c}"><div class="c"><svg viewBox="-11 -11 22 22">${G[g]}</svg></div><span>${n}</span></div>`).join('');
let d='';let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};for(let i=0;i<40;i++)d+=`<i style="left:${r()*500}px;top:${r()*330}px;opacity:${.3+r()*.7}"></i>`;document.getElementById('dust').innerHTML=d;
</script></body></html>
